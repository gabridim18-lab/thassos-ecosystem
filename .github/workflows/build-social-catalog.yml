name: Build Thassos social catalog
on:
  push:
    branches: [main]
    paths:
      - 'destinations/thassos/**'
      - 'scripts/build_social_catalog.py'
      - '.github/workflows/build-social-catalog.yml'
  pull_request:
    paths:
      - 'destinations/thassos/**'
      - 'scripts/build_social_catalog.py'
      - 'tests/test_social_catalog.py'
      - '.github/workflows/build-social-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test catalog rules
        run: python3 -m unittest discover -s tests -v
      - name: Build catalog
        run: python3 scripts/build_social_catalog.py
      - name: Commit regenerated catalog (only main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- catalog/thassos-catalog.json || [ -n "$(git ls-files --others --exclude-standard -- catalog/thassos-catalog.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add catalog/thassos-catalog.json
            git commit -m 'chore: update Thassos social catalog [skip ci]'
            git push
          else
            echo 'Catalog unchanged.'
          fi
