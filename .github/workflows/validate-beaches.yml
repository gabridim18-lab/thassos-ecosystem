name: Validate beach JSON
on:
  push:
    paths:
      - 'destinations/**/beach.json'
      - 'scripts/validate_beach.py'
      - '.github/workflows/validate-beaches.yml'
  pull_request:
    paths:
      - 'destinations/**/beach.json'
      - 'scripts/validate_beach.py'
jobs:
  json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_beach.py
