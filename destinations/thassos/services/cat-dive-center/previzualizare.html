<figure><img loading="lazy" src="images/Echipamente de scufundări în centru SSI.webp" alt="SSI dive center interior with scuba diving gear"/><figcaption>SSI dive center interior with scuba diving gear</figcaption></figure></div><p class="muted" id="photo"></p></section></main><footer class="foot">CAT Dive Center · Skala Prinos · Thassos <span>· Prepared for Thassos ecosystem · 2026</span></footer><script type="application/json" id="pageData">{"translations": {"ro": {"short": "Descoperă lumea subacvatică a insulei Thassos prin scufundări pentru începători, cursuri SSI, explorări ghidate și snorkeling în Skala Prinos.", "description": "În Skala Prinos, CAT Dive Center (Center Action Thassos) îi invită pe vizitatori să descopere apele Mării Egee într-un mod diferit. Centrul, care declară peste 15 ani de activitate, organizează experiențe pentru cei care încearcă pentru prima dată scuba diving, dar și activități pentru scafandri certificați.\n\nProgramul Try Scuba este o introducere în scufundări, cu explicații despre echipament și ghidaj oferit de instructori. Oferta prezentată pe website-ul oficial include și cursuri, scufundări recreative și snorkeling. În funcție de nivelul participanților și de condițiile mării, centrul poate oferi și scufundări de pe barcă, nocturne sau la epave.\n\nUn avantaj pentru turiștii români este că website-ul centrului menționează explicit instruirea în limba română, alături de engleză, greacă, germană, franceză și maghiară. Pentru programări, tarife, condiții medicale, vârsta minimă și disponibilitatea instructorilor, este bine să contactezi centrul înainte de vizită."}, "en": {"short": "Explore Thassos underwater with beginner scuba experiences, SSI courses, guided dives and snorkeling in Skala Prinos.", "description": "Located in Skala Prinos, CAT Dive Center (Center Action Thassos) introduces visitors to a different side of the Aegean Sea. The center reports more than 15 years of experience and welcomes both first-time participants and certified divers.\n\nTry Scuba offers a first introduction to breathing underwater, with equipment guidance and instructor supervision. The official website also features courses, fun dives and snorkeling. Depending on certification level, availability and sea conditions, boat dives, night dives and wreck dives may be offered.\n\nThe center lists instruction in Romanian, English, Greek, German, French and Hungarian. Contact the team before visiting to confirm schedules, prices, medical requirements, minimum ages and instructor availability."}, "el": {"short": "Ανακαλύψτε τον υποβρύχιο κόσμο της Θάσου με δοκιμαστικές καταδύσεις, μαθήματα SSI, οργανωμένες καταδύσεις και snorkeling στη Σκάλα Πρίνου.", "description": "Στη Σκάλα Πρίνου, το CAT Dive Center (Center Action Thassos) προσφέρει μια διαφορετική γνωριμία με το Αιγαίο. Το κέντρο αναφέρει περισσότερα από 15 χρόνια εμπειρίας και απευθύνεται τόσο σε αρχάριους όσο και σε πιστοποιημένους δύτες.\n\nΤο πρόγραμμα Try Scuba αποτελεί μια πρώτη γνωριμία με την αυτόνομη κατάδυση, με ενημέρωση για τον εξοπλισμό και καθοδήγηση από εκπαιδευτές. Ο επίσημος ιστότοπος παρουσιάζει επίσης μαθήματα, καταδύσεις αναψυχής και snorkeling. Ανάλογα με την πιστοποίηση, τη διαθεσιμότητα και τις συνθήκες της θάλασσας, μπορεί να προσφέρονται καταδύσεις από σκάφος, νυχτερινές καταδύσεις και καταδύσεις σε ναυάγια.\n\nΤο κέντρο αναφέρει εξυπηρέτηση στα ελληνικά, αγγλικά, γερμανικά, γαλλικά, ρουμανικά και ουγγρικά. Επικοινωνήστε πριν από την επίσκεψη για ωράρια, τιμές, ιατρικές προϋποθέσεις, ελάχιστες ηλικίες και διαθεσιμότητα εκπαιδευτών."}, "de": {"short": "Erlebe die Unterwasserwelt von Thassos mit Schnuppertauchen, SSI-Kursen, geführten Tauchgängen und Schnorcheln in Skala Prinos.", "description": "In Skala Prinos lädt das CAT Dive Center (Center Action Thassos) dazu ein, die Ägäis aus einer neuen Perspektive zu entdecken. Das Zentrum gibt an, seit mehr als 15 Jahren aktiv zu sein, und bietet Erlebnisse für Einsteiger ebenso wie für zertifizierte Taucher.\n\nTry Scuba ermöglicht erste Erfahrungen unter Wasser, begleitet von einer Einweisung in die Ausrüstung und professioneller Betreuung. Laut offizieller Website gehören außerdem Kurse, Freizeittauchgänge und Schnorcheln zum Angebot. Je nach Ausbildungsstand, Verfügbarkeit und Seebedingungen können auch Boots-, Nacht- und Wracktauchgänge angeboten werden.\n\nAls Unterrichtssprachen nennt das Zentrum Deutsch, Englisch, Griechisch, Französisch, Rumänisch und Ungarisch. Öffnungszeiten, Preise, medizinische Voraussetzungen, Mindestalter und Verfügbarkeit der Tauchlehrer sollten vor dem Besuch bestätigt werden."}, "bg": {"short": "Открийте подводния свят на Тасос с пробни гмуркания, SSI курсове, водени гмуркания и шнорхелинг в Скала Принос.", "description": "В Скала Принос CAT Dive Center (Center Action Thassos) предлага възможност да опознаете Егейско море по различен начин. Центърът посочва над 15 години опит и приема както начинаещи, така и сертифицирани водолази.\n\nПрограмата Try Scuba дава първи досег с гмуркането с водолазна екипировка, с инструкции за оборудването и наблюдение от инструктор. Официалният сайт представя също курсове, развлекателни гмуркания и шнорхелинг. Според квалификацията, наличността и морските условия могат да се предлагат гмуркания от лодка, нощни гмуркания и посещения на потънали обекти.\n\nЦентърът посочва обучение на гръцки, английски, немски, френски, румънски и унгарски. Преди посещение потвърдете графика, цените, медицинските изисквания, минималната възраст и наличните инструктори."}, "sr": {"short": "Otkrijte podvodni svet Tasosa uz probno ronjenje, SSI kurseve, vođene zarone i snorkeling u Skali Prinos.", "description": "U Skali Prinos, CAT Dive Center (Center Action Thassos) nudi priliku da Egejsko more doživite iz drugačije perspektive. Centar navodi više od 15 godina iskustva i prima početnike, kao i sertifikovane ronioce.\n\nProgram Try Scuba namenjen je prvom upoznavanju sa ronjenjem, uz objašnjenje opreme i nadzor instruktora. Na zvaničnom sajtu predstavljeni su i kursevi, rekreativni zaroni i snorkeling. U zavisnosti od nivoa obuke, raspoloživosti i uslova na moru, mogu biti dostupni zaroni sa čamca, noćni zaroni i obilasci olupina.\n\nCentar navodi obuku na grčkom, engleskom, nemačkom, francuskom, rumunskom i mađarskom jeziku. Pre dolaska proverite termine, cene, zdravstvene uslove, minimalni uzrast i dostupnost instruktora."}}, "ui": {"ro": {"eyebrow": "Thassos · Skala Prinos · Scufundări", "about": "Descoperă centrul", "experiences": "Experiențe disponibile", "gallery": "Galerie foto", "details": "Informații utile", "hours": "Program", "hoursValue": "Confirmă telefonic — sursele afișează ore diferite", "contact": "Sună centrul", "website": "Website oficial", "map": "Vezi pe hartă", "note": "Prețurile, orele și disponibilitatea se confirmă direct cu operatorul.", "photo": "Fotografiile sunt furnizate pentru această fișă.", "activities": ["Try Scuba · pentru începători", "Cursuri și certificări SSI", "Scufundări ghidate", "Snorkeling", "Scufundări cu barca*", "Scufundări nocturne*", "Scufundări la epave*"], "qualifier": "* În funcție de certificare, program și condițiile mării."}, "en": {"eyebrow": "Thassos · Skala Prinos · Diving", "about": "Discover the center", "experiences": "Activities & courses", "gallery": "Photo gallery", "details": "Useful information", "hours": "Opening hours", "hoursValue": "Confirm by phone — listings differ", "contact": "Call the center", "website": "Official website", "map": "Open map", "note": "Prices, hours and availability must be confirmed with the operator.", "photo": "Photos supplied for this listing.", "activities": ["Try Scuba · beginners", "SSI courses and certification", "Guided fun dives", "Snorkeling", "Boat dives*", "Night dives*", "Wreck dives*"], "qualifier": "* Subject to certification, scheduling and sea conditions."}, "el": {"eyebrow": "Θάσος · Σκάλα Πρίνου · Καταδύσεις", "about": "Γνωρίστε το κέντρο", "experiences": "Δραστη
